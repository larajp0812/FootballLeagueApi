name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"

env:
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run ESLint
        run: cd frontend && npm run lint
        continue-on-error: false

      - name: Run Tests
        run: cd frontend && npm test
        continue-on-error: false

      - name: Build production bundle
        run: cd frontend && npm run build
        continue-on-error: false

      - name: Check bundle size
        run: |
          cd frontend
          DIST_SIZE=$(du -sh dist | cut -f1)
          echo "✅ Build successful! Distribution size: $DIST_SIZE"

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency security audit
        run: cd frontend && npm audit --audit-level=moderate
        continue-on-error: true

  accessibility-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm install

  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Build for Azure
        run: cd frontend && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.AZURE_VITE_API_BASE_URL }}

      - name: Upload to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true

      - name: Deployment note
        run: |
          echo "✅ Frontend deployed to Azure Static Web Apps"
          echo "App URL: https://${{ steps.builddeploy.outputs.static_web_app_url }}"

      - name: Build app
        run: cd frontend && npm run build
